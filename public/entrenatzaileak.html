<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<meta name="robots" content="noindex,nofollow">
<title>Orioko FT · Entrenatzaileentzako panela</title>
<style>

.back-home {
  display: block;
  max-width: 600px;
  margin: 12px auto;
  padding: 10px 16px;
  color: #171717;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
}

:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#222;background:#f5f5f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:25px auto;padding:0 16px}header{background:#171717;color:#fff;border-bottom:5px solid #f2c500;padding:24px;border-radius:17px 17px 0 0;display:flex;align-items:center;gap:20px}header img{width:65px;height:65px;object-fit:contain}h1{font-size:24px;margin:0 0 4px}.subtitle{font-size:13px;color:#f2c500;font-weight:700;letter-spacing:.08em}.main{padding:24px;background:white;border-radius:0 0 17px 17px;box-shadow:0 8px 28px #0001}.login{max-width:430px;margin:20px auto}.field{display:grid;gap:8px;margin:18px 0}input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font:inherit;background:#fff}button{background:#171717;color:white;border:0;border-radius:9px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.muted{color:#6d6d6d;font-size:13px;line-height:1.5}.error{color:#a32020}.hide{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:22px 0}.card{background:#faf8eb;border:1px solid #eee4ab;border-radius:12px;padding:16px}.card strong{display:block;font-size:29px}.card span{font-size:12px;color:#555}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{border:1px solid #e2e2e2;padding:18px;border-radius:12px;margin:16px 0}h2{font-size:18px;margin:0 0 15px}.barrow{display:grid;grid-template-columns:115px 1fr 36px;gap:10px;align-items:center;margin:12px 0;font-size:13px}.track{background:#eeeeee;border-radius:10px;overflow:hidden;height:13px}.fill{background:#f2c500;height:100%}.comments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.comment{border-left:3px solid #f2c500;padding:9px 11px;background:#fafafa;font-size:14px;line-height:1.5;overflow-wrap:anywhere;margin:8px 0}.note{background:#fff8d9;border-left:4px solid #f2c500;padding:13px;border-radius:8px;margin:18px 0}.empty{color:#777;font-size:14px}@media(max-width:700px){.wrap{margin:0;padding:0}.main{padding:16px}header{border-radius:0}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.comments{grid-template-columns:1fr}.barrow{grid-template-columns:93px 1fr 30px}h1{font-size:20px}}
</style>
</head>
<body>

<a href="/" class="back-home">
  ← Hasierako menura itzuli
</a>

<div class="wrap">
<header><img src="/LOGOTIPO.png" alt="Orioko FT"><div><div class="subtitle">ORIOKO FT · PRIBATUA</div><h1>Entrenatzaileentzako panela</h1></div></header>
<main class="main">
<section id="login" class="login">
  <h2>Sarbide pribatua</h2>
  <p class="muted">Panel hau entrenatzaile-taldearentzat soilik da. Sartu pasahitza emaitzak ikusteko.</p>
  <form id="loginForm"><label class="field">Pasahitza<input id="password" type="password" autocomplete="off" required minlength="12" placeholder="Pasahitza"></label><button id="enter" type="submit">Sartu panelera</button></form>
  <p id="loginMsg" role="status" class="error"></p>
</section>
<section id="dashboard" class="hide">
  <div class="topline"><div class="field"><label for="game">Partida</label><select id="game"></select></div><button id="logout" type="button">Saioa itxi</button></div>
  <div id="summary"></div>
</section>
</main>
</div>
<script>
let results = [];
const $ = (selector) => document.querySelector(selector);
function node(tag, text, className) { const e = document.createElement(tag); if (text !== undefined) e.textContent = String(text); if (className) e.className = className; return e; }
function section(title) { const panel = node('div',undefined,'panel'); panel.append(node('h2',title)); return panel; }
function bar(parent,name,value,max=5) { const row=node('div',undefined,'barrow'); row.append(node('span',name));const track=node('div',undefined,'track');const fill=node('div',undefined,'fill');fill.style.width=`${Math.max(0,Math.min(100,value/max*100))}%`;track.append(fill);row.append(track,node('strong',String(value)));parent.append(row); }
function render() {
 const selected=results.find(p=>p.id === $('#game').value), root=$('#summary');root.replaceChildren();if(!selected)return;
 const heading=node('div',undefined,'note');heading.textContent=`${selected.izena} · ${selected.data || 'Data gabe'} · ${selected.kopurua} erantzun`;root.append(heading);
 if(!selected.batezbestekoak) {root.append(node('p','Gutxienez 5 erantzun behar dira balorazioak erakusteko. Horrela, jokalarien anonimotasuna hobeto babesten dugu.','muted'));return;}
 const stats=[['Erantzunak',selected.kopurua],['Ahalegina',selected.batezbestekoak.ahalegina],['Norberaren jarduna',selected.batezbestekoak.jarduna],['Taktika',selected.batezbestekoak.taktika],['Taldearen jarduna',selected.batezbestekoak.taldea]];
 const cards=node('div',undefined,'cards');for(const [title,value] of stats){const card=node('div',undefined,'card');card.append(node('strong',value),node('span',title));cards.append(card);}root.append(cards);
 const columns=node('div',undefined,'grid'), averages=section('Batez bestekoak (1–5)'), feels=section('Zelaiko sentsazioak');
 for(const [label,key] of [['Ahalegina','ahalegina'],['Jarduna','jarduna'],['Taktika','taktika'],['Taldea','taldea']])bar(averages,label,selected.batezbestekoak[key]);
 for(const [label,count] of Object.entries(selected.sentsazioak))bar(feels,label,count,selected.kopurua);
 columns.append(averages,feels);root.append(columns);
 const comments=section('Erantzun irekiak'),items=node('div',undefined,'comments');
 for(const [title,key] of [['Ondo egindakoa','ondo'],['Hobetzekoak','hobetu'],['Entrenatzaileentzako oharrak','oharrak']]) { const group=node('div');group.append(node('h2',title));const vals=selected.testuak[key];if(!vals.length) group.append(node('p','Ez dago erantzunik.','empty'));for(const value of vals)group.append(node('p',value,'comment'));items.append(group); }
 comments.append(items);root.append(comments);
}
$('#loginForm').addEventListener('submit',async e=>{
 e.preventDefault();const btn=$('#enter');const msg=$('#loginMsg');btn.disabled=true;msg.textContent='Egiaztatzen...';
 try {const r=await fetch('/.netlify/functions/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value}),cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Errorea');results=d.partidak||[];$('#password').value='';$('#login').classList.add('hide');$('#dashboard').classList.remove('hide');const sel=$('#game');sel.replaceChildren();results.forEach(p=>sel.append(new Option(`${p.izena} (${p.kopurua})`,p.id)));if(results.length)sel.value=results.find(p=>p.kopurua>0)?.id||results[0].id;render();msg.textContent='';}
 catch(err){msg.textContent=err.message;}
 finally{btn.disabled=false;}
});
$('#game').addEventListener('change',render);
$('#logout').addEventListener('click',()=>{results=[];$('#summary').replaceChildren();$('#dashboard').classList.add('hide');$('#login').classList.remove('hide');});
</script>
</body>
</html>
