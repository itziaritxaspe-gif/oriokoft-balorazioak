<!doctype html><html lang="eu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><meta name="robots" content="noindex,nofollow"><title>Orioko FT · Entrenatzaileentzako panela</title>
<style>:root{font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:#171717;background:#f5f5f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1060px;margin:26px auto;padding:0 16px}header{background:#171717;color:#fff;border-bottom:5px solid #f2c500;border-radius:16px 16px 0 0;padding:24px;display:flex;gap:15px;align-items:center}header img{width:65px;height:65px;object-fit:contain}h1{font-size:22px;margin:4px 0}.club{color:#f2c500;font-size:12px;letter-spacing:1px;font-weight:800}.main{background:white;padding:24px;border-radius:0 0 16px 16px}.back{color:#171717;text-decoration:none;font-size:13px;font-weight:700}.login{max-width:410px;margin:24px auto}.field{display:grid;gap:9px;margin:17px 0}input,select{padding:12px;border:1px solid #ccc;border-radius:9px;font:inherit;background:white;max-width:100%;width:100%}button{padding:12px 18px;background:#171717;color:#fff;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.error{color:#aa2222}.hide{display:none!important}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:20px 0}.card{background:#fff8d9;border:1px solid #ebd98d;border-radius:11px;padding:14px}.card strong{display:block;font-size:27px}.card small{color:#555}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{padding:17px;border:1px solid #ddd;border-radius:12px;margin:14px 0}h2{font-size:18px}.bar{display:grid;grid-template-columns:105px 1fr 35px;gap:9px;align-items:center;margin:12px 0;font-size:13px}.track{height:12px;border-radius:12px;overflow:hidden;background:#eee}.fill{background:#f2c500;height:100%}.comments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.comment{padding:9px;background:#fafafa;border-left:3px solid #f2c500;overflow-wrap:anywhere;font-size:14px}.note{background:#fff8d9;padding:13px;border-radius:9px;border-left:4px solid #f2c500}.muted{color:#666;font-size:13px}@media(max-width:740px){.wrap{padding:0;margin:0}header{border-radius:0}.main{padding:16px;border-radius:0}.filters,.two,.comments{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head>
<body><div class="wrap"><header><img src="/LOGOTIPO.png" alt="Orioko FT"><div><div class="club">ORIOKO FT · SARBIDE PRIBATUA</div><h1>Entrenatzaileentzako panela</h1></div></header><main class="main"><a href="/" class="back">← Hasierako menura itzuli</a><section id="login" class="login"><h2>Pasahitza</h2><p class="muted">Entrenatzaile bakoitzak bere taldeko pasahitza sartuko du. Administratzaileak klub osoko datuak ikus ditzake.</p><form id="loginForm"><label class="field">Pasahitza<input type="password" id="password" required autocomplete="off" minlength="12" maxlength="200"></label><button id="enter" type="submit">Sartu panelera</button></form><p id="loginMsg" class="error" role="status"></p></section><section id="dashboard" class="hide"><div class="filters"><label class="field">Taldea<select id="team"></select></label><label class="field">Partida<select id="game"></select></label><button id="logout" type="button">Irten</button></div><div id="summary"></div></section></main></div>
<script>
let result={taldeak:[],partidak:[],admin:false};const $=s=>document.querySelector(s);function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=String(text);if(cls)x.className=cls;return x;}
function panel(title){const x=el('div',undefined,'panel');x.append(el('h2',title));return x;}
function bar(host,label,v,max=5){const row=el('div',undefined,'bar'),track=el('div',undefined,'track'),fill=el('div',undefined,'fill');fill.style.width=`${Math.min(100,Math.max(0,(v/max)*100))}%`;track.append(fill);row.append(el('span',label),track,el('strong',v));host.append(row);}
function gamesForTeam(){return result.partidak.filter(g=>g.taldeId===$('#team').value);}
function updateGames(){const games=gamesForTeam(),sel=$('#game');sel.replaceChildren();for(const g of games)sel.append(new Option(`${g.izena} (${g.kopurua})`,g.id));if(games.length)sel.value=games[0].id;render();}
function render(){const g=gamesForTeam().find(x=>x.id===$('#game').value),root=$('#summary');root.replaceChildren();if(!g){root.append(el('p','Ez dago partidarik talde honetan.','muted'));return;}const note=el('div',`${g.izena} · ${g.data} · ${g.kopurua} erantzun`,'note');root.append(note);if(!g.batezbestekoak){root.append(el('p','Gutxienez 5 erantzun behar dira emaitzak erakusteko.','muted'));return;}const cards=el('div',undefined,'cards');for(const [k,v] of [['Erantzunak',g.kopurua],['Ahalegina',g.batezbestekoak.ahalegina],['Jarduna',g.batezbestekoak.jarduna],['Taktika',g.batezbestekoak.taktika],['Taldea',g.batezbestekoak.taldea]]){const c=el('div',undefined,'card');c.append(el('strong',v),el('small',k));cards.append(c);}root.append(cards);const two=el('div',undefined,'two'),a=panel('Batez bestekoak (1–5)'),b=panel('Zelaiko sentsazioak');for(const [k,v] of Object.entries(g.batezbestekoak))bar(a,({ahalegina:'Ahalegina',jarduna:'Jarduna',taktika:'Taktika',taldea:'Taldea'})[k],v);for(const [k,v] of Object.entries(g.sentsazioak))bar(b,k,v,g.kopurua);two.append(a,b);root.append(two);const comments=panel('Erantzun irekiak'),cols=el('div',undefined,'comments');for(const [heading,key] of [['Ondo egindakoa','ondo'],['Hobetzekoak','hobetu'],['Oharrak','oharrak']]){const col=el('div');col.append(el('h3',heading));for(const txt of g.testuak[key])col.append(el('p',txt,'comment'));if(!g.testuak[key].length)col.append(el('p','Ez dago erantzunik.','muted'));cols.append(col);}comments.append(cols);root.append(comments);}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#enter');btn.disabled=true;$('#loginMsg').textContent='Egiaztatzen...';try{const r=await fetch('/.netlify/functions/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({password:$('#password').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Errorea');result=d;$('#password').value='';$('#login').classList.add('hide');$('#dashboard').classList.remove('hide');$('#team').replaceChildren();for(const t of d.taldeak)$('#team').append(new Option(t.izena,t.id));updateGames();$('#loginMsg').textContent='';}catch(err){$('#loginMsg').textContent=err.message;}finally{btn.disabled=false;}});
$('#team').addEventListener('change',updateGames);$('#game').addEventListener('change',render);$('#logout').addEventListener('click',()=>{result={taldeak:[],partidak:[],admin:false};$('#summary').replaceChildren();$('#dashboard').classList.add('hide');$('#login').classList.remove('hide');});
</script></body></html>
